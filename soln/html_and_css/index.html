<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To-Do List</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>My To-Do List</h1>

  <div class="input-container">
    <input id="taskInput" type="text" placeholder="Enter a task" />
    <button id="addBtn">Add</button>
    <button id="clearBtn" class="secondary">Clear All</button>
  </div>

  <p class="hint">Tip: Press <strong>Enter</strong> to add. Click a task to complete it.</p>

  <ul id="taskList">
    <li>
        <span class="task-text">Buy Milk</span>
        <button class="delete-btn">Delete</button>
      </li>
      <li>
        <span class="task-text">Buy Bread</span>
        <button class="delete-btn">Delete</button>
      </li>
      <li>
        <span class="task-text">Buy Eggs</span>
        <button class="delete-btn">Delete</button>
      </li>
  </ul>

  <script src="script.js"></script>
</body>
</html>
